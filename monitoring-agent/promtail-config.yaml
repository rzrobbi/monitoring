server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://192.168.110.21:3100/loki/api/v1/push   # IP monitoring server

scrape_configs:
  - job_name: system
    static_configs:
      - targets:
          - localhost
        labels:
          job: varlogs
          host: manage-docker   # label host untuk log sistem
          __path__: /var/log/*.log

  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        regex: '(.+)'
        target_label: 'compose_service'
      - source_labels: ['__meta_docker_container_id']
        target_label: 'container_id'
      # Tambahkan baris berikut untuk menambahkan label host statis
      - target_label: 'host'
        replacement: 'manage-docker'   # <-- ganti sesuai nama VM
