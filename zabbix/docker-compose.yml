services:
  # Database PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: zabbix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: zabbixgunas
      POSTGRES_DB: zabbix
    volumes:
      - /mnt/synology/zabbix/postgres-data:/var/lib/postgresql/data
    networks:
      - zabbix-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zabbix"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Zabbix Server
  zabbix-server:
    image: zabbix/zabbix-server-pgsql:alpine-6.4-latest
    container_name: zabbix-server
    restart: unless-stopped
    environment:
      DB_SERVER_HOST: postgres
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: zabbixgunas
      POSTGRES_DB: zabbix
      ZBX_CACHESIZE: "128M"
    ports:
      - "10051:10051"
    volumes:
      - /mnt/synology/zabbix/server-modules:/usr/lib/zabbix/externalscripts
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - zabbix-net

  # Zabbix Web Interface (Nginx + PHP)
  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:alpine-6.4-latest
    container_name: zabbix-web
    restart: unless-stopped
    environment:
      DB_SERVER_HOST: postgres
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: zabbixgunas
      POSTGRES_DB: zabbix
      ZBX_SERVER_HOST: zabbix-server
      PHP_TZ: Asia/Jakarta
    ports:
      - "8081:8080"
    depends_on:
      - postgres
      - zabbix-server
    networks:
      - zabbix-net

  # Zabbix Agent untuk monitoring host Docker
  zabbix-agent:
    image: zabbix/zabbix-agent:alpine-6.4-latest
    container_name: zabbix-agent
    restart: unless-stopped
    environment:
      ZBX_HOSTNAME: Zabbix-server
      ZBX_SERVER_HOST: zabbix-server
    ports:
      - "10050:10050"
    networks:
      - zabbix-net

networks:
  zabbix-net:
    driver: bridge